
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Posit Connect Cloud</title>
  <style>
    @font-face {
      font-family: 'Open Sans';
      font-display: fallback;
      src: url("https://connect.posit.cloud/fonts/OpenSans-Regular.woff2") format('woff2'),
           url("https://connect.posit.cloud/fonts/OpenSans-Regular.woff") format('woff');
      font-weight: normal;
      font-style: normal;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fff;
      color: #303030;
      font-family: "Open Sans", sans-serif;
      font-size: 14px;
      font-weight: normal;
      -webkit-font-smoothing: antialiased;
    }
    .centered {
      position: fixed;
      top: 45%;
      left: 50%;
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .message {
      background-color: #f9f8f8;
      border-radius: 50px;
      display: inline-block;
      font-size: 18px;
      line-height: 50px;
      opacity: .95;
      padding: 20px 50px 20px 40px;
      white-space: nowrap;
    }
    .spinner-container {
      display: inline-block;
      height: 35px;
      margin-right: 10px;
      position: relative;
      top: 5px;
      width: 35px;
    }
    .spinner {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      -webkit-animation: rotate 2s infinite linear;
      animation: rotate 2s infinite linear;
    }
    .dot {
      width: 40%;
      height: 40%;
      border-radius: 50%;
      position: absolute;
      -webkit-animation: progressPulse 2s infinite ease-in-out;
      animation: progressPulse 2s infinite ease-in-out;
    }
    .dot.one {
      top: 0;
      left: 30%;
      background-color: #447099;
    }
    .dot.two {
      top: 30%;
      left: 0;
      -webkit-animation-delay: -1.5s;
      animation-delay: -1.5s;
      background-color: #447099;
    }
    .dot.three {
      bottom: 0;
      left: 30%;
      -webkit-animation-delay: -1s;
      animation-delay: -1s;
      background-color: #447099;
    }
    .dot.four {
      top: 30%;
      right: 0;
      -webkit-animation-delay: -0.5s;
      animation-delay: -0.5s;
      background-color: #447099;
    }

    @-webkit-keyframes rotate {
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg); }
    }

    @keyframes rotate {
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg); }
    }

    @-webkit-keyframes progressPulse {
      0%, 100% {
        -webkit-transform: scale(.1);
        transform: scale(.1);
        opacity: .1;
      }
      50% {
        -webkit-transform: scale(1);
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes progressPulse {
      0%, 100% {
        -webkit-transform: scale(.1);
        transform: scale(.1);
        opacity: .1;
      }
      50% {
        -webkit-transform: scale(1);
        transform: scale(1);
        opacity: 1;
      }
    }

    main {
      align-items: center;
      display: flex;
      height: 100%;
      justify-content: center;
    }
    
    h1 {
      color: inherit;
      font-size: 2.4em;
      font-weight: 300;
      margin: .75em 0 .5em 0;
    }
	
    p {
      line-height: 1.6em;
      margin-bottom: 1em;
    }
	
    .container {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      justify-content: center;
      margin: 1rem;
    }
	
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
      .error_message {
        max-width: 450px;
      }
    }

  </style>
</head>
