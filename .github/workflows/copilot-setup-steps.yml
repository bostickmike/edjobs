name: Copilot setup steps

# Read by the Copilot coding agent before it starts work on an assigned issue
# (scraper auto-fix issues filed here by the MT/WY weekly drift checks, since
# the shared platform scrapers moved here in phase 3, 2026-11-11): R and the
# package's dependencies, so it can run the package tests. The job MUST be
# named copilot-setup-steps. Runs on its own when this file changes.

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
