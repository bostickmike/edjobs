# R CMD check on every push and pull request. A tag is only cut from a commit
# this passed on.
name: R-CMD-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use an apt mirror outside ubuntu.com if it does not resolve
        # 2026-11-11: hosted runners could not resolve *.ubuntu.com (other hosts
        # fine), so apt-get update in setup-r hung until the job timed out. No-op
        # when ubuntu.com resolves; the timeouts make a future hang fail fast.
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
          if ! timeout 10 getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo "::warning::azure.archive.ubuntu.com does not resolve; using mirrors.edge.kernel.org"
            printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
            sudo sed -i -E 's#https?://(azure\.)?(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' /etc/apt/sources.list.d/*.sources
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          # The 2026-11-11 hangs were apt (*.ubuntu.com not resolving), not
          # 'release'; the mirror fallback above handles that.
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
